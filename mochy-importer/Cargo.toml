# mochy-importer — Account/link/CSV/local importers, TrackMatcher, TransferArchive, YT sync engine
#
# Responsibility and upstream absorption: docs/PORT_SPEC.md "Workspace layout".
# Upstream source (Android, pin bde01cb4): importer/ (42 files: Spotify/Apple/Tidal accounts, LinkImporter, CsvImport, LocalImportService, transfer/) + utils/SyncUtils (YT two-way sync)
[package]
name = "mochy-importer"
description = "Account/link/CSV/local importers, TrackMatcher, TransferArchive, YT sync engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Inherit the workspace lint table (root Cargo.toml).
[lints]
workspace = true

[dependencies]
# Sync gating reads the live settings snapshot (ytReportPlays, ytPullHistory,
# ytmSync, ytSyncHold, ytExcludeImports, offlineMode...).
mochy-config = { path = "../mochy-config" }
# The signed-in check reads the cookie from the OS keychain vault
# (upstream: dataStore InnerTubeCookieKey + parseCookieString).
mochy-vault = { path = "../mochy-vault" }
# parseCookieString + the future full-sync facade adapter (Phase 22).
mochy-innertube = { path = "../mochy-innertube" }

serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Async tests for the replay/engine seams (dev-only: the public API stays
# tokio-free — futures are boxed, Phase 06 precedent).
tokio = { workspace = true }
tempfile = "3.27.0"

