# mochy-player — PlayerCore mixer + voices, QueueMachine, Transport fades, ErrorPolicy, sleep timer, SongTuning
#
# Responsibility and upstream absorption: docs/PORT_SPEC.md "Workspace layout".
# Upstream source (Android, pin bde01cb4): MusicService.kt logic (5,667 lines decomposed) + playback/queues (7 queue types) + SleepTimer + SongTuning + PlayerConnection facade
[package]
name = "mochy-player"
description = "PlayerCore mixer + voices, QueueMachine, Transport fades, ErrorPolicy, sleep timer, SongTuning."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Inherit the workspace lint table (root Cargo.toml).
[lints]
workspace = true

[dependencies]
# Phase 08: the decode pipeline (TrackDecoder, SincResampler,
# RangedMediaSource) the voices fill their rings from. Domain-only — no
# GPUI, no tokio in this crate's public API (PORT_SPEC §3.1).
mochy-audio = { path = "../mochy-audio" }
thiserror = { workspace = true }
