# mochy-config — Settings registry (~400 keys with defaults + search metadata), audio-lab store, atomic persistence, live watchers
#
# Responsibility and upstream absorption: docs/PORT_SPEC.md "Workspace layout".
# Upstream source (Android, pin bde01cb4): constants/PreferenceKeys.kt (1,399 lines; 398 static keys + per-style key factory) + utils/DataStore + 22 SharedPreferences stores + eq/AudioLabStore
[package]
name = "mochy-config"
description = "Settings registry (~400 keys with defaults + search metadata), audio-lab store, atomic persistence, live watchers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

# Inherit the workspace lint table (root Cargo.toml).
[lints]
workspace = true

[dependencies]
# Domain crate: serde + thiserror + tracing only — no GPUI, no tokio
# (PORT_SPEC §3.1 layering rules).
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# Backup serializer for the settings file (blueprint ch. 9: "JSON/TOML
# serializer"); added to the workspace table in Phase 02.
toml = { workspace = true }
# `settings!` macro identifier concatenation (set_<Row> accessors).
paste = { workspace = true }
