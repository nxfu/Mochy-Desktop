# mochy-net — reqwest factory with proxy/DNS/IP-version policy, response cache, offline flag
#
# Responsibility and upstream absorption: docs/PORT_SPEC.md "Workspace layout".
# Upstream source (Android, pin bde01cb4): network utils: AppProxy (SOCKS/HTTP + auth), IpVersion pinning, okhttp-dnsoverhttps (DoH), OfflineMode/DataSaver gates, 50 MB disk cache
[package]
name = "mochy-net"
description = "reqwest factory with proxy/DNS/IP-version policy, response cache, offline flag."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Shared HTTP layer over the app's dedicated tokio runtime (PORT_SPEC §3.1
# rule 4); rustls/socks/cookies/brotli/gzip/http2/system-proxy per Phase 01
# feature verification.
reqwest = { workspace = true }
tokio = { workspace = true }
hickory-resolver = { workspace = true }
moka = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Integration tests against a local one-shot HTTP server.
tokio = { workspace = true, features = ["io-util"] }
