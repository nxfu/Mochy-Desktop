# CI — Mochy Music for Desktop.
#
# Phase 01 scope: keep the workspace green on all three target OSes and
# publish the phase's patch series as an artifact. The release workflow is a
# commented stub for Phase 24 (see bottom of this file).
#
# The toolchain is pinned by rust-toolchain.toml (1.100.0 + rustfmt +
# clippy); the install step parses the file so this workflow never holds a
# second, drifting copy of the pin.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          CHANNEL="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          echo "Installing pinned toolchain: ${CHANNEL}"
          rustup toolchain install "${CHANNEL}" --profile minimal --component rustfmt --component clippy
          rustup default "${CHANNEL}"

      # Phase 04 note: once crates depend on gpui/wry, the Linux leg needs
      # their system libraries, e.g.:
      #   sudo apt-get update && sudo apt-get install -y \
      #     libxkbcommon-dev libwayland-dev libvulkan-dev \
      #     libgtk-3-dev libasound2-dev libudev-dev
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  patches:
    name: phase patch series
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: format-patch needs the base ref

      - name: Generate patches (origin/main..HEAD)
        run: |
          mkdir -p patches
          git format-patch origin/main..HEAD -o patches/
          echo "--- patch series ---"
          ls -1 patches/ || true

      - name: Upload patches artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-patches
          path: patches/
          if-no-files-found: ignore # empty when running on main itself

